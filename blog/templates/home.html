{% extends "base.html" %}
{% block stuff %}
<h1>CSS Example Coloring</h1>

{% for post in posts %}
<div class="post-entry">
    <h2><a href="{{ post.get_absolute_url }}">{{ post.title}}</a></h2>
    <p>Author: {{post.author}}</p>
    <p>{{post.body}}</p>
    <p>---</p>
</div>
{% endfor %}
{% endblock stuff %}
